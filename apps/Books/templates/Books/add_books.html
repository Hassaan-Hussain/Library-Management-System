<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Books</title>
</head>
<body>
    {% comment %} <div>
        {% for msg in messages %}
            {{msg}}
        {% endfor %}
    </div> {% endcomment %}
    <form action="" method="post"> 
        {% csrf_token %}
        {{ form }}
        <button type="submit">Add</button>
    </form>

    <a href="{% url "books_view" %}"><button>Display Books</button></a>

</body>
</html>
