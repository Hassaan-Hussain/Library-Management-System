<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
</head>
<body style='background-color: grey;'>
    <h1>Login Page</h1>

    {% if messages %}
        {% for msg in messages %}
            {{ msg }}
        {% endfor %}
    {% endif %}

    <form action="" method="post">
        {% csrf_token %}
        {{ login_form }}
        <button type="submit">Login</button>
    </form>

    <p>Don't have an account? <a href="{% url "register" %}"><button>Register</button></a></p>

</body>
</html>
